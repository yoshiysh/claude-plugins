[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
BASH_DEFAULT_TIMEOUT_MS = "600000"
BASH_MAX_TIMEOUT_MS = "600000"
ANTHROPIC_DEFAULT_OPUS_MODEL = "claude-opus-4-6[1m]"
