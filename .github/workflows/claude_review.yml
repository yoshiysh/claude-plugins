name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      ${{ github.event.pull_request.draft == false &&
          github.event.sender.type == 'User' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # code-review プラグインは差分を gh pr diff だけで取る（allowed-tools に git が無い）。
      # gh pr diff は 300 ファイル超などで HTTP 406（PullRequest.diff too_large）を返すため、
      # API が差分を返すかを先に試し、断られた PR だけ git で作った差分を読む経路へ回す。
      - name: Check whether the API serves the PR diff
        id: size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr diff "${PR_NUMBER}" --name-only > /dev/null 2> "${RUNNER_TEMP}/diff.err"; then
            echo "large=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'too_large' "${RUNNER_TEMP}/diff.err"; then
            cat "${RUNNER_TEMP}/diff.err"
            echo "large=true" >> "$GITHUB_OUTPUT"
          else
            cat "${RUNNER_TEMP}/diff.err" >&2
            exit 1
          fi

      - name: Review with the code-review plugin
        if: steps.size.outputs.large == 'false'
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # 三点ドットで GitHub の Files changed と同じ範囲。core.quotePath=false で
      # 非 ASCII のパスを 8 進エスケープさせない（awk のパス抽出が壊れるため）。
      # ロックファイル・バイナリはロジックのレビューに寄与しないので除外し、
      # 理由付きで excluded.txt に残す。
      - name: Split the PR diff per file
        if: steps.size.outputs.large == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/pr-base"
          git -c core.quotePath=false diff --no-color --no-ext-diff \
            "origin/pr-base...${HEAD_SHA}" > "${RUNNER_TEMP}/pr.diff"
          out=.claude-review
          mkdir -p "$out/diff"
          awk -v outdir="$out/diff" '
            /^diff --git /{ if (f) close(f);
                            name=$4; sub(/^b\//,"",name); gsub("/","__",name);
                            f=outdir "/" name ".diff" }
            f { print > f }
          ' "${RUNNER_TEMP}/pr.diff"
          : > "$out/index.txt"
          : > "$out/excluded.txt"
          find "$out/diff" -maxdepth 1 -type f -name '*.diff' | sort | while IFS= read -r f; do
            path=$(awk 'NR==1{print}' "$f" | sed -nE 's#^diff --git a/(.*) b/.*#\1#p')
            if printf '%s' "$path" | grep -qE '(^|/)(.*\.lock|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|uv\.lock|poetry\.lock)$'; then
              echo "$path (lockfile)" >> "$out/excluded.txt"; rm -f "$f"
            elif grep -q '^Binary files ' "$f"; then
              echo "$path (binary)" >> "$out/excluded.txt"; rm -f "$f"
            else
              echo "$path $(wc -c < "$f") $f" >> "$out/index.txt"
            fi
          done
          echo "files=$(wc -l < "$out/index.txt") excluded=$(wc -l < "$out/excluded.txt")"

      - name: Review a diff too large for the API
        if: steps.size.outputs.large == 'true'
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}.
            Its diff is too large for the GitHub API, so it has been split per file
            under .claude-review/. Do not call gh pr diff.

            - .claude-review/index.txt lists every reviewable file as
              "<path> <bytes> <diff file>". Read the diff files from there.
            - .claude-review/excluded.txt lists lockfiles and binaries left out on purpose.
            - The checked-out tree is the PR merged into its base; read surrounding
              code from it when a change needs context. Follow CLAUDE.md and AGENTS.md.

            Report only high-signal problems: code that will fail, logic that is wrong
            regardless of input, security defects, and clear violations of a rule you
            can quote from CLAUDE.md or AGENTS.md. Skip style and speculative concerns.
            Read application code before tests and docs. Verify each problem against
            the code before reporting it.

            Post each problem with mcp__github_inline_comment__create_inline_comment
            on a changed line, with confirmed: true. Then post one summary with
            gh pr comment that states the overall result and lists:
            - every file from index.txt you did not read, under the heading
              "Not reviewed (PR too large)", or "none" if you read them all
            - the files in excluded.txt with their reasons
            Do not claim coverage you did not have.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
