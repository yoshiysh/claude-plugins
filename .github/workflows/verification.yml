name: Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-scope:
    runs-on: ubuntu-latest
    outputs:
      run_bp_prd: ${{ steps.scope.outputs.run_bp_prd }}
      run_formal_skill: ${{ steps.scope.outputs.run_formal_skill }}
      run_formal_z3: ${{ steps.scope.outputs.run_formal_z3 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            run_bp_prd=$(sh tests/formal/bp-prd/prd_sections.sh affected tests/formal/bp-prd/PRD.sections \
              tests/formal/bp-prd/ .github/workflows/verification.yml < "$RUNNER_TEMP/changed-files")

            if grep -E '^(tests/formal/formal-method-skill/|\.agents/skills/formal-method/|plugins/verification/skills/formal-method/|plugins/formal-method/|\.github/workflows/verification\.yml)' "$RUNNER_TEMP/changed-files" > /dev/null; then
              run_formal_skill=true
            else
              run_formal_skill=false
            fi

            if grep -E '^(tests/formal/formal-method-requirements/|tests/formal/formal-method-skill/z3_streams\.py|docs/requirements/formal-method\.md|docs/specifications/formal-method\.md|\.agents/skills/formal-method/|plugins/verification/skills/formal-method/|plugins/formal-method/|\.github/workflows/verification\.yml)' "$RUNNER_TEMP/changed-files" > /dev/null; then
              run_formal_z3=true
            else
              run_formal_z3=false
            fi
          else
            run_bp_prd=true
            run_formal_skill=true
            run_formal_z3=true
          fi
          echo "run_bp_prd=$run_bp_prd" >> "$GITHUB_OUTPUT"
          echo "run_formal_skill=$run_formal_skill" >> "$GITHUB_OUTPUT"
          echo "run_formal_z3=$run_formal_z3" >> "$GITHUB_OUTPUT"

  formal-bp-prd:
    needs: formal-scope
    if: needs.formal-scope.outputs.run_bp_prd == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '11'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
      - name: Cache TLC jar
        id: cache-tlc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/tla2tools.jar
          key: tla2tools-v1.7.4
      - name: Download pinned TLC
        if: steps.cache-tlc.outputs.cache-hit != 'true'
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: |
          curl --fail --location --retry 3 --output "$TLA2TOOLS" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: Check BP requirements model
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: |
          command -v java
          command -v rustc
          command -v shasum
          tests/formal/bp-prd/check.sh

  formal-method-skill:
    needs: formal-scope
    if: needs.formal-scope.outputs.run_formal_skill == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '11'
      - name: Cache TLC jar
        id: cache-tlc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/tla2tools.jar
          key: tla2tools-v1.7.4
      - name: Download pinned TLC
        if: steps.cache-tlc.outputs.cache-hit != 'true'
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: |
          curl --fail --location --retry 3 --output "$TLA2TOOLS" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: Check formal-method design models (shard ${{ matrix.shard }}/8)
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
          OUT_DIR: ${{ runner.temp }}/formal-method-skill-out
          SHARD: ${{ matrix.shard }}/8
        # shell を明示すると bash --noprofile --norc -eo pipefail {0} になり、check.sh の失敗が tee の成功に隠れない
        shell: bash
        run: sh tests/formal/formal-method-skill/check.sh | tee "$RUNNER_TEMP/formal-method-skill-${{ matrix.shard }}.jsonl"
      - name: Preserve model checking results and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formal-method-skill-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/formal-method-skill-${{ matrix.shard }}.jsonl
            ${{ runner.temp }}/formal-method-skill-out/
          if-no-files-found: warn

  formal-method-z3:
    needs: formal-scope
    if: needs.formal-scope.outputs.run_formal_z3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Cache Z3 zip
        id: cache-z3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/z3.zip
          key: z3-5.3.3-x64-glibc-2.39-d56f60b06f432f33
      - name: Download pinned Z3
        if: steps.cache-z3.outputs.cache-hit != 'true'
        env:
          Z3_ZIP: ${{ runner.temp }}/z3.zip
        run: |
          curl --fail --location --retry 3 --output "$Z3_ZIP" \
            https://github.com/Z3Prover/z3/releases/download/z3-5.3.3/z3-5.3.3-x64-glibc-2.39.zip
      - name: Verify and unpack Z3
        env:
          Z3_ZIP: ${{ runner.temp }}/z3.zip
        run: |
          echo "d56f60b06f432f33de5810f7f1a384a339131f361e2d54d08ea83eea14326880  $Z3_ZIP" | sha256sum -c -
          unzip -q -o "$Z3_ZIP" -d "$RUNNER_TEMP/z3"
      - name: Locate Z3
        run: |
          z3=$(find "$RUNNER_TEMP/z3" -path '*/bin/z3' -type f | head -1)
          [ -n "$z3" ] || { echo 'z3 executable not found in the archive' >&2; exit 1; }
          echo "Z3=$z3" >> "$GITHUB_ENV"
      - name: Check formal-method requirements
        run: python3 -I tests/formal/formal-method-requirements/check.py
      # Linux の Z3 の出力の流れと終了コードを、cli-contract.md の adapter の表（macOS の実測）と比べる。
      - name: Measure Z3 output streams and exit codes on Linux
        if: always()
        run: python3 -I tests/formal/formal-method-skill/z3_streams.py

  verify-static-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.0'
      - name: Cache runtime node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: plugins/workflow/skills/dynamic-workflow-runner/scripts/runtime/node_modules
          key: runtime-deps-${{ runner.os }}-${{ hashFiles('plugins/workflow/skills/dynamic-workflow-runner/scripts/runtime/package-lock.json') }}
      # prd-spec の doc_check は既存文書の改訂で prd-graph（plugins/workflow/crates）を呼ぶので、unittest の前に toolchain を置く。
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - name: Verify plugin Rust crates
        run: make test-rust
      - name: Verify static checks, Python unittests, eval preflight, and portability
        run: make test-static-and-python portability

  verify-node-traceability:
    runs-on: ubuntu-latest
    env:
      NODE_TEST_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.0'
      - name: Cache runtime node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: plugins/workflow/skills/dynamic-workflow-runner/scripts/runtime/node_modules
          key: runtime-deps-${{ runner.os }}-${{ hashFiles('plugins/workflow/skills/dynamic-workflow-runner/scripts/runtime/package-lock.json') }}
      - name: Verify traceability Node tests
        run: make test-node-traceability
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-reports
          path: |
            .artifacts/verification/traceability.json
            .artifacts/verification/coverage.json
            .artifacts/verification/report.md
          if-no-files-found: warn

  verify-node-other:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      NODE_TEST_CONCURRENCY: '4'
      NODE_TEST_SHARD: ${{ matrix.shard }}/5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.0'
      - name: Cache runtime node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: plugins/workflow/skills/dynamic-workflow-runner/scripts/runtime/node_modules
          key: runtime-deps-${{ runner.os }}-${{ hashFiles('plugins/workflow/skills/dynamic-workflow-runner/scripts/runtime/package-lock.json') }}
      - name: Verify other Node tests (shard ${{ matrix.shard }}/5)
        run: make test-node-other

  verification:
    needs: [verify-static-and-python, verify-node-traceability, verify-node-other]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all verification jobs succeeded
        env:
          STATIC_RESULT: ${{ needs.verify-static-and-python.result }}
          TRACE_RESULT: ${{ needs.verify-node-traceability.result }}
          OTHER_RESULT: ${{ needs.verify-node-other.result }}
        run: |
          if [ "$STATIC_RESULT" != "success" ] || [ "$TRACE_RESULT" != "success" ] || [ "$OTHER_RESULT" != "success" ]; then
            echo "Verification failed: static=$STATIC_RESULT traceability=$TRACE_RESULT other=$OTHER_RESULT" >&2
            exit 1
          fi
