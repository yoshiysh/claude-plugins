name: Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-bp-prd-scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            run=$(sh tests/formal/bp-prd/prd_sections.sh affected tests/formal/bp-prd/PRD.sections \
              tests/formal/bp-prd/ .github/workflows/verification.yml plugins/workflow/skills/prd-spec/scripts/doc_check.mjs < "$RUNNER_TEMP/changed-files")
          else
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  formal-bp-prd:
    needs: formal-bp-prd-scope
    if: needs.formal-bp-prd-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.0'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '11'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
      - name: Download pinned TLC
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: |
          set -euo pipefail
          url=$(node plugins/workflow/skills/prd-spec/scripts/doc_check.mjs formal-tools | node -e 'let s = ""; process.stdin.on("data", (d) => { s += d }).on("end", () => process.stdout.write(JSON.parse(s).url))')
          curl --fail --location --retry 3 --output "$TLA2TOOLS" "$url"
      - name: Check BP requirements model
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: |
          command -v java
          command -v rustc
          command -v shasum
          tests/formal/bp-prd/check.sh

  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.0'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '11'
      # prd-spec の formal-check の判定テストは実 TLC で走る。入手元と sha256 の正本は doc_check の formal-tools（ここに写さない）。
      - name: Download pinned TLC for prd-spec formal-check
        env:
          TLA2TOOLS: ${{ runner.temp }}/tla2tools.jar
        run: |
          set -euo pipefail
          tools() { node plugins/workflow/skills/prd-spec/scripts/doc_check.mjs formal-tools; }
          curl --fail --location --retry 3 --output "$TLA2TOOLS" "$(node -e 'console.log(JSON.parse(process.argv[1]).url)' "$(tools)")"
          node -e 'const t = JSON.parse(process.argv[1]); if (t.fault) { console.error(t.fault); process.exit(1) }' "$(tools)"
          echo "TLA2TOOLS=$TLA2TOOLS" >> "$GITHUB_ENV"
      - name: Verify repository
        run: make check
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-reports
          path: |
            .artifacts/verification/traceability.json
            .artifacts/verification/coverage.json
            .artifacts/verification/report.md
          if-no-files-found: warn
